[package]
name = "deepagents"
description = "Top-level library: re-exports all sub-crates, provides DeepAgentBuilder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
deepagents-core = { workspace = true }
deepagents-config = { workspace = true }
deepagents-env = { workspace = true }
deepagents-errors = { workspace = true }
deepagents-hooks = { workspace = true }
deepagents-plugins = { workspace = true }
deepagents-sessions = { workspace = true }
deepagents-approval = { workspace = true }
deepagents-mcp = { workspace = true }
deepagents-skills = { workspace = true }
deepagents-sandbox = { workspace = true }
deepagents-cost = { workspace = true }
deepagents-goal = { workspace = true }
deepagents-onboarding = { workspace = true }
deepagents-update = { workspace = true }
deepagents-doctor = { workspace = true }
deepagents-cli = { workspace = true, optional = true }
deepagents-tui = { workspace = true, optional = true }

[features]
default = ["cli", "tui"]
# CLI sub-crate (clap derive + command dispatch).
cli = ["dep:deepagents-cli"]
# TUI sub-crate (ratatui + crossterm).
tui = ["dep:deepagents-tui"]

# Q-ref: Q1-Q26
